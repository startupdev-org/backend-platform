# Local machine and the Render dev service. Verbose, but never destructive:
# schema changes go through Flyway migrations, not ddl-auto.
spring:
  jpa:
    show-sql: true

# Loose throttle locally so manual testing isn't blocked, but the filter still runs.
rate-limit:
  capacity: 100
  refill-tokens: 100

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
