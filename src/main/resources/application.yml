spring:
  application:
    name: service-platform

  profiles:
    # Defaulted to dev, which is what CLAUDE.md has always claimed. Without the
    # default an unset SPRING_PROFILES_ACTIVE is an unresolvable placeholder and the
    # app refuses to start, so a fresh clone could not follow the documented setup.
    # Both Render services set the variable explicitly, so neither one relies on this.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Local development only: a gitignored file next to this one.
  # Deployed environments supply the same keys as real environment variables.
  config:
    import:
      - optional:classpath:secrets.properties
      - optional:file:/etc/secrets/secrets.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema in every environment. ddl-auto never writes.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
jwt:
  secret: ${JWT_SECRET}
  # Access token: minutes, not a day. It cannot be revoked, so this value is the
  # revocation window. Both Render services must drop JWT_EXPIRATION (or set it to
  # 900000) - an env var set to the old 86400000 would silently keep the 24h window.
  expiration: ${JWT_EXPIRATION:900000}
  # Refresh token: 30 days. Revocable, single-use, stored hashed.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

# Password reset. Single-use tokens, stored hashed, deliberately short-lived: the
# lifetime is exactly how long a working link sits reachable in an inbox.
password-reset:
  expiration: ${PASSWORD_RESET_EXPIRATION:1800000}

# Where the SPA lives, for building the reset link. The only place this service needs
# to know the frontend's address; everything else is origin-checked through cors.
app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

server:
  # Render injects PORT; SERVER_PORT is the local override.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

# Object storage (Cloudflare R2) for business logos, covers, and employee photos.
# Uploads go browser-to-bucket through a presigned URL - no image bytes pass through
# this service - so max-upload-bytes is advisory. The enforceable limit is the bucket's
# own file_size_limit, and the bucket's CORS rules must allow PUT from the app origins.
storage:
  provider: r2
  bucket: ${STORAGE_BUCKET}
  signed-url-ttl-seconds: 60
  max-upload-bytes: 5242880
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-url-base: ${R2_PUBLIC_URL_BASE:}


# Abuse controls on the public auth endpoints. The per-IP throttle is in-memory
# (per-instance); lockout is per-account and DB-backed.
rate-limit:
  enabled: true
  capacity: 10
  refill-tokens: 10
  refill-period-seconds: 60
  cache-expire-minutes: 15
  cache-max-size: 100000
  lockout:
    enabled: true
    max-failed-attempts: 5
    base-minutes: 15
    max-minutes: 1440

logging:
  level:
    root: INFO
    com.platform: INFO

# Actuator (BP-66). Only "health" is ever added to exposure.include - never "*" -
# so env, beans, mappings, heapdump, and configprops all stay unreachable over HTTP
# regardless of SecurityConfig. show-details is when-authorized rather than the
# never default: an anonymous caller (Render's own health checker included) sees
# only the bare UP/DOWN status, while a request carrying a valid JWT sees which
# component failed - useful mid-incident without turning the probe into a public
# system map.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Boot 3.2 only auto-publishes the liveness/readiness groups when it detects a
      # Kubernetes environment. Render isn't Kubernetes, so this has to be forced on
      # explicitly rather than relying on that auto-detection.
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          # readinessState is Spring's own "can this instance serve traffic" flag.
          # db is added explicitly - it is not a member of the group by default -
          # so a Neon outage actually flips /actuator/health/readiness to DOWN
          # instead of only showing up buried in the (unauthenticated) aggregate
          # /actuator/health. No R2 indicator here: presigning a PUT URL never
          # calls R2 over the network (see R2StorageProvider), a real check would
          # mean polling a third party on every probe, and image-upload failures
          # already surface per-request as a clean 502 (GlobalExceptionHandler ->
          # StorageException) without needing the whole instance marked unready -
          # bookings, browsing, and every other route work fine with R2 down.
          include: readinessState, db