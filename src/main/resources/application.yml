spring:
  application:
    name: service-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # Local development only: a gitignored file next to this one.
  # Deployed environments supply the same keys as real environment variables.
  config:
    import: optional:classpath:secrets.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema in every environment. ddl-auto never writes.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  # Render injects PORT; SERVER_PORT is the local override.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.platform: INFO
