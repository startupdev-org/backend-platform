spring:
  application:
    name: service-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # Local development only: a gitignored file next to this one.
  # Deployed environments supply the same keys as real environment variables.
  config:
    import: optional:classpath:secrets.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema in every environment. ddl-auto never writes.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  # Render injects PORT; SERVER_PORT is the local override.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

# Object storage (Cloudflare R2) for business logos, covers, and employee photos.
# Uploads go browser-to-bucket through a presigned URL - no image bytes pass through
# this service - so max-upload-bytes is advisory. The enforceable limit is the bucket's
# own file_size_limit, and the bucket's CORS rules must allow PUT from the app origins.
storage:
  provider: r2
  bucket: ${STORAGE_BUCKET}
  signed-url-ttl-seconds: 60
  max-upload-bytes: 5242880
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-url-base: ${R2_PUBLIC_URL_BASE:}

logging:
  level:
    root: INFO
    com.platform: INFO
