# Test profile for the Testcontainers integration suite (BP-61).
#
# The real datasource comes from AbstractIntegrationTest's @ServiceConnection
# PostgreSQLContainer, not from any URL below - Spring Boot's service-connection
# support replaces the auto-configured DataSource (and Flyway's, since Flyway just
# reuses the primary DataSource bean here) with one built from the running
# container, regardless of what spring.datasource.* resolves to.
#
# What this file actually exists for is placeholder resolution: application.yml
# references DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, ALLOWED_ORIGINS and
# STORAGE_BUCKET with no defaults, and Spring resolves those placeholders while
# binding @ConfigurationProperties beans (DataSourceProperties among them) whether
# or not the resulting value is ever used. Every one of those keys needs *some*
# value here or the context fails to start before Testcontainers even gets a say -
# same reasoning as secrets.properties.example for local dev, just inline.
DB_URL: jdbc:postgresql://placeholder-overridden-by-service-connection/db
DB_USER: test
DB_PASSWORD: test
JWT_SECRET: integration-test-jwt-signing-secret-not-used-anywhere-else
ALLOWED_ORIGINS: http://localhost:5173
STORAGE_BUCKET: test-bucket

# R2 defaults to blank in application.yml, but the AWS SDK's S3Client/S3Presigner
# builders (StorageConfig) reject a blank access key at construction time - so the
# @SpringBootTest full-context test needs non-blank dummy values. No R2 call is
# ever made: nothing in this suite exercises the image endpoints, and the client
# only talks to R2 lazily on first use.
R2_ACCOUNT_ID: test-account
R2_ACCESS_KEY_ID: test-access-key
R2_SECRET_ACCESS_KEY: test-secret-key
R2_PUBLIC_URL_BASE: https://pub-test.r2.dev

spring:
  flyway:
    enabled: true
    # baseline-on-migrate: true (application.yml) exists for the two pre-Flyway Neon
    # databases - it only changes behaviour when Flyway finds a non-empty schema with
    # no history table, which never happens here, so it is a no-op either way on a
    # fresh container. Set to false anyway: this suite's whole point is proving V1..V9
    # apply cleanly to nothing, and false makes it fail loudly instead of silently
    # baselining if a container ever surprises us with pre-existing tables.
    baseline-on-migrate: false

  jpa:
    show-sql: false
    # hibernate.ddl-auto: validate is inherited from application.yml and deliberately
    # NOT overridden here - it is the assertion this whole ticket exists to run: that
    # the entities and the 9 migrations agree, in CI, before a deploy.

logging:
  level:
    com.platform: INFO
    org.testcontainers: INFO
