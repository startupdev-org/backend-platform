# Base (non-profile-specific) config for the test classpath.
#
# application.yml references DB_URL / DB_USER / DB_PASSWORD / JWT_SECRET /
# ALLOWED_ORIGINS / STORAGE_BUCKET with no defaults, and spring.profiles.active as
# a bare ${SPRING_PROFILES_ACTIVE}. Spring resolves every one of those placeholders
# while preparing the Environment, even for a slice test that never opens a
# datasource or a test whose real datasource comes from Testcontainers, so each
# needs a value here or the context fails before the test can run. None are real.
# spring.profiles.active also has to live here, not in application-test.yml:
# Spring Boot rejects it inside a profile-specific resource.
spring.profiles.active=test
DB_URL=jdbc:postgresql://localhost:5432/unused
DB_USER=unused
DB_PASSWORD=unused
JWT_SECRET=test-classpath-secret-not-used-for-signing-anything-here
ALLOWED_ORIGINS=http://localhost:5173
STORAGE_BUCKET=unused
