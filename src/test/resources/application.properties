# Base (non-profile-specific) test config for the Testcontainers suite (BP-61).
#
# This one line has to live here, not in application-test.yml: Spring Boot 2.4+
# rejects spring.profiles.active inside a profile-specific resource
# (InvalidConfigDataPropertyException), and application-test.yml is one.
#
# AbstractIntegrationTest also carries @ActiveProfiles("test"), which is what
# actually activates the profile for the TestContext framework. This property is
# the separate thing AppConfig needs: it reads spring.profiles.active back out via
# @Value with no default, and @ActiveProfiles never populates the property itself.
# Setting it here covers both - the profile is active AND the placeholder resolves.
spring.profiles.active=test
